services:
  yuna:
    image: ghcr.io/theinternetuse7/yuna:latest
    container_name: yuna
    restart: unless-stopped
    pull_policy: always
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - yuna-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yuna-data:
